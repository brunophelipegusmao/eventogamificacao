services:
  db:
    image: postgres:17-alpine
    container_name: gamif_evento_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: gamif
      POSTGRES_PASSWORD: gamif_dev_password
      POSTGRES_DB: gamif_evento
    ports:
      - "5432:5432"
    volumes:
      - gamif_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gamif -d gamif_evento"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  gamif_pgdata:
